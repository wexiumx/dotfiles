[theme]
builtin = "Noctalia"
community_palette = "Catppuccin Frappe Sapphire"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "ghostty", "helix", "niri", "qt", "starship" ]
    community_ids = [
        "spicetify",
        "zen-browser",
        "discord",
        "telegram",
        "obsidian",
        "zed",
        "heroiclauncher",
        "fastfetch",
        "zellij",
        "papirus-icons",
        "bat",
        "lazygit",
        "yazi"
    ]

[wallpaper]
directory = "/home/wexiumx/Pictures/Wallpapers"
transition = [ "disc", "honeycomb", "stripes", "wipe" ]

    [wallpaper.default]
    path = "/home/wexiumx/Pictures/Wallpapers/gruvbox_2.png"

    [wallpaper.last]
    path = "/home/wexiumx/Pictures/Wallpapers/gruvbox_2.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/wexiumx/Pictures/Wallpapers/gruvbox_2.png"

    [wallpaper.monitors.HDMI-A-2]
    path = "/home/wexiumx/Pictures/Wallpapers/gruvbox_2.png"

[widget.bar]
